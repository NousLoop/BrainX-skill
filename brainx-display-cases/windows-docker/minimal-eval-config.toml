model_provider = "magpie-local"
model = "codex/gpt-6.1-sol"
model_reasoning_effort = "xhigh"
service_tier = "default"

# NOTE: `disable_response_storage` was removed; codex 0.166.0 treats it as an
# unrecognized setting and logs a warning on every run.

# Local Magpie proxy on the evaluation host, reached through the magpie-models
# shim (brainx-display-cases/windows-docker/magpie-models-shim.py). The shim listens on 3426
# and forwards requests to Magpie on port 3425, reconstructing HTTP response
# framing. GET /v1/models is translated into the pinned Codex catalog schema;
# the upstream OpenAI-style listing cannot be decoded by this CLI. The shim must be
# running whenever an evaluation runs. This file is consumed inside the
# evaluator container, so the host must be addressed through the Docker Desktop
# gateway `host.docker.internal`; 127.0.0.1 would point at the container
# itself. codex refuses to override the reserved built-in provider id `openai`,
# so the endpoint is declared under a custom id. Keeping base_url in these
# bytes (rather than relying on the CLI default) is what freezes the endpoint
# under evaluation: nothing outside this file can silently move a run to
# another host.
[model_providers.magpie-local]
name = "Magpie local proxy (models-shim)"
base_url = "http://host.docker.internal:3426/v1"
wire_api = "responses"

# The API key is fetched at runtime by running a shell command inside the
# evaluator container that prints the OPENAI_API_KEY environment variable; the
# harness injects that variable at launch (from git-ignored brainx-eval.env).
# The key therefore never enters this file, the repository, or the container
# image, so the config bytes stay identical across runs, hosts, and key
# rotations. (codex 0.166.0 has no env_key support in provider auth, hence the
# command form.)
[model_providers.magpie-local.auth]
command = "sh"
args = ["-c", "printf %s \"$OPENAI_API_KEY\""]
timeout_ms = 5000
refresh_interval_ms = 0

# Placeholder path: run-refinement-case.sh rewrites it to the in-container
# location (/bundle/mcp-servers/codex/server.mjs) when preparing the isolated
# CODEX_HOME, so no real checkout path belongs in this committed template.
[mcp_servers.codex]
# Codex filters child MCP environments; preserve the isolated config and credential.
env_vars = ["CODEX_HOME", "OPENAI_API_KEY", "BRAINX_CODEX_BIN"]
command = "node"
args = ["/path/to/brainx-skill-bundle/mcp-servers/codex/server.mjs"]
default_tools_approval_mode = "approve"
tool_timeout_sec = 1800
